[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pptx-to-markdown"
version = "0.1.2"
description = "Convert PowerPoint presentations to structured Markdown"
license = { text = "MIT" }
authors = [{ name = "magifd2" }]
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.0",
    "click>=8.0.0",
]

[project.urls]
Repository = "https://github.com/nlink-jp/pptx-to-markdown"

[project.scripts]
pptx2md = "pptx_to_markdown.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pptx_to_markdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pptx_to_markdown"]
